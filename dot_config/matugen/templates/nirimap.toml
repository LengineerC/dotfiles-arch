[display]
height = 60
max_width_percent = 0.4
max_height_percent = 0.7
anchor = "top-right"
margin_x = 16
margin_y = 25
workspace_mode = "all"

[appearance]
background = "{{colors.background.default.hex}}"
window_color = "{{colors.outline.default.hex}}"
focused_color = "{{colors.primary.default.hex}}"
border_color = "{{colors.outline.default.hex}}"

border_width = 1
border_radius = 5
gap = 3

background_opacity = 0.0
window_opacity = 0.55
focused_opacity = 0.8

workspace_gap = 6
active_workspace_border_color = "{{colors.primary.default.hex}}"
active_workspace_border_width = 2

[labels]
enabled = false

[icons]
enabled = true
size = "auto"
position = "center"
opacity = 0.9
min_window_size = 16

[behavior]
always_visible = false
hide_timeout_ms = 2000
show_for_floating_windows = false
