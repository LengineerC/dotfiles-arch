[mgr]
ratio = [1, 4, 3]
linemode = "size_and_mtime"

[preview]
max_width = 600
max_height = 900
cache_dir = ""
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
neovide = [
    { run = 'neovide "$@"', block = true, desc = "Neovide" },
]

nvim = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" },
]

vim = [
    { run = 'vim "$@"', block = true, desc = "Vim" },
]

vscode = [
    { run = 'code "$@"', orphan = true, desc = "VS Code" },
]

[open]
rules = [
    { mime = "text/*", use = ["neovide", "nvim", "vim", "vscode"] },
    { mime = "folder/*", use = ["neovide", "nvim", "vim", "vscode"] },
]

[plugin]
prepend_previewers = [
  { url = "*.csv", run = "rich-preview"}, # for csv files
  { url = "*.md", run = "rich-preview" }, # for markdown (.md) files
  { url = "*.rst", run = "rich-preview"}, # for restructured text (.rst) files
  { url = "*.ipynb", run = "rich-preview"}, # for jupyter notebooks (.ipynb)
  { url = "*.json", run = "rich-preview"}, # for json (.json) files
  { url = "*.lang_type", run = "rich-preview"} # for particular language files eg. .py, .go., .lua, etc.
]

prepend_fetchers = [
  # git.yazi
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
